# Local PostgreSQL for development and integration tests. Start it with:  docker compose up -d db
# Credentials come from the git-ignored .env next to this file (copy .env.example and fill it in).
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is never reachable from other machines on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps its data under /var/lib/postgresql/18/docker, so the volume is mounted one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  # Survives `docker compose down`; only `docker compose down -v` deletes the data.
  pgdata:
