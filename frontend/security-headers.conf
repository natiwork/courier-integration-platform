# Security headers for the app (not /api: the backend sets its own). Included in each location of nginx.conf, because an add_header inside a
# location replaces (not extends) the ones set on the server.
#
# Content-Security-Policy: only our own scripts, styles, fonts and API. The one inline script (the theme, applied
# before the first paint in index.html) is allowed by its hash; frontend/src/securityHeaders.test.ts fails if
# the script changes and this hash isn't updated.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-NfRM8n4tOvmnJKwCJU3hg22EbD/SDVm0QI/M9rI3J1g='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
