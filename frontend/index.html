<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LogiFlow: manage e-commerce orders and courier integrations." />
    <meta name="theme-color" content="#13312b" />
    <title>LogiFlow</title>
    <script>
      // Apply the saved (or system) theme before the first paint, so there is no flash of the wrong theme.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('logiflow-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (error) {
          // Storage blocked: fall back to light.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
