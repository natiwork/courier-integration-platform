# Serves the built single-page app and forwards API calls to the backend container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # No nginx version in error pages or the Server header.
  server_tokens off;

  # The API, webhooks included (the backend checks their signatures over the raw body; nginx passes it as is).
  # The backend sets its own security headers (backend/src/middleware/securityHeaders.ts).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Above the backend's own limits, so the backend answers with its JSON error (413) instead of nginx.
    client_max_body_size 2m;
    # A ship request can wait for the courier (3 attempts with timeouts and backoff).
    proxy_read_timeout 120s;
  }

  # File names in /assets contain a content hash: a changed file gets a new name, so they can be cached for good.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/shipments/123, /couriers) all load index.html; React Router takes it from there.
  # index.html itself is never cached, so a new deploy is picked up on the next visit.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
