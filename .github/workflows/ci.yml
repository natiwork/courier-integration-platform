name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-integration:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The same image as docker-compose.yml. Throwaway credentials: this database only lives for this job.
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: courier_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d courier_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The test setup creates and migrates this database itself (the name must end with _test).
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/courier_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # The e2e config starts the backend (in memory, demo data) and the Vite dev server itself.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
        working-directory: e2e
      - name: Upload the Playwright report (only when tests failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
